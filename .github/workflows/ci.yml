name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maddenhq
          POSTGRES_PASSWORD: maddenhq
          POSTGRES_DB: maddenhq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maddenhq -d maddenhq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maddenhq:maddenhq@localhost:5432/maddenhq?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-ci
      EA_TOKEN_ENCRYPTION_KEY: ci-ea-encryption-key-32chars!!!!
      ENABLE_DEV_LOGIN: "true"
      EA_CLIENT_MODE: stub

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
