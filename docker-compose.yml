services:
  db:
    image: postgres:16-alpine
    container_name: maddenhq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: maddenhq
      POSTGRES_PASSWORD: maddenhq
      POSTGRES_DB: maddenhq
    ports:
      - "5432:5432"
    volumes:
      - maddenhq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maddenhq -d maddenhq"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: maddenhq-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  maddenhq_pgdata:
